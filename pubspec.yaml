name: login_page
description: Neeramoy QR Scanner app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  email_validator: ^3.0.0
  file_picker: ^8.3.0
  flutter_barcode_scanner: ^2.0.0
  flutter_spinkit: ^5.1.0
  get: ^4.7.3
  http: ^1.3.0
  image_picker: ^1.0.0
  intl: ^0.20.2
  mobile_scanner: ^7.4.2
  provider: ^6.1.5
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.0
  flutter_gen_runner: ^5.15.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/home/
    - assets/images/login/

flutter_gen:
  output: lib/gen/
